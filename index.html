<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Monetag HTML Verification Code -->
  <meta name="monetag" content="81a9664dfb58cb6d15cabc7f54bfe5b2">
  
  <title>MST Crypto Miner & Spin to Earn</title>

  <!-- Google Fonts & Font Awesome for Styling -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: #131722;
      --accent-green: #00ff88;
      --accent-gold: #ffb703;
      --accent-purple: #7209b7;
      --accent-pink: #f72585;
      --text-light: #f8f9fa;
      --text-dim: #a0aab8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header & Balance Card */
    header {
      background: linear-gradient(135deg, #1e1b4b, #31104b);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .balance-box {
      background: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--accent-gold);
    }

    .balance-box i {
      font-size: 1.8rem;
      color: var(--accent-gold);
    }

    .balance-box span {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent-green);
    }

    /* Tabs Navigation */
    .nav-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
      max-width: 200px;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-purple);
      color: #fff;
      border-color: var(--accent-pink);
      box-shadow: 0 0 15px rgba(247, 37, 133, 0.4);
    }

    /* Tab Content Cards */
    .tab-content {
      display: none;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .tab-content.active {
      display: block;
    }

    /* --- Spin Section --- */
    .spin-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 320px;
      margin: 20px 0;
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid var(--accent-gold);
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    #wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
    }

    .spin-btn {
      background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple));
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(247, 37, 133, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .spin-btn:hover {
      transform: scale(1.05);
    }

    .spin-btn:disabled {
      background: #4a4e69;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* --- Mining Section --- */
    .miner-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .rig-graphic {
      font-size: 4rem;
      color: var(--accent-green);
      margin: 10px 0;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px var(--accent-green)); }
    }

    .progress-bar-bg {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-green), var(--accent-gold));
      transition: width 0.3s;
    }

    /* --- Withdraw Section --- */
    .withdraw-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      text-align: left;
    }

    .form-group label {
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .form-group input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
    }

    .withdraw-btn {
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 15px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: opacity 0.2s;
    }

    .history-list {
      margin-top: 20px;
      list-style: none;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }

    /* --- Colorful Modal/Popup --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: linear-gradient(135deg, #2a0845, #6441a5);
      border: 3px solid var(--accent-gold);
      border-radius: 25px;
      padding: 30px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 0 50px rgba(255, 183, 3, 0.6);
      transform: scale(0.7);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.show .modal-card {
      transform: scale(1);
    }

    .modal-icon {
      font-size: 3.5rem;
      color: var(--accent-gold);
      margin-bottom: 15px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    .modal-title {
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .modal-body {
      color: #e0e0e0;
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .modal-btn {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      width: 100%;
    }

    .modal-btn.double-btn {
      background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      box-shadow: 0 4px 15px rgba(247, 37, 133, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header displaying current state -->
    <header>
      <h1><i class="fa-solid fa-microchip"></i> HERO MST MINER</h1>
      <div class="balance-box">
        <i class="fa-solid fa-coins"></i>
        <span id="balance">0</span> MST
      </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('spin-tab', event)"><i class="fa-solid fa-dharmachakra"></i> Spin</button>
      <button class="tab-btn" onclick="switchTab('mine-tab', event)"><i class="fa-solid fa-pickaxe"></i> Mine</button>
      <button class="tab-btn" onclick="switchTab('withdraw-tab', event)"><i class="fa-solid fa-wallet"></i> Withdraw</button>
    </div>

    <!-- SPIN TO EARN TAB -->
    <div id="spin-tab" class="tab-content active">
      <div class="spin-container">
        <h2>Spin & Win MST</h2>
        <p style="color: var(--text-dim); margin-top: 5px;">Test your luck to win up to 100 MST!</p>
        
        <div class="wheel-wrapper">
          <div class="pointer"></div>
          <canvas id="wheel" width="320" height="320"></canvas>
        </div>

        <button id="spin-btn" class="spin-btn" onclick="spinWheel()">SPIN NOW</button>
        <p id="spin-count" style="margin-top: 10px; color: var(--text-dim);">Spins left today: <span id="spins-left">10</span></p>
      </div>
    </div>

    <!-- CRYPTO MINING TAB -->
    <div id="mine-tab" class="tab-content">
      <div class="miner-box">
        <h2>MST Cloud Rig #1</h2>
        <div class="rig-graphic">
          <i class="fa-solid fa-server"></i>
        </div>
        <p>Active Hashrate: <strong>14.5 MH/s</strong></p>
        <p style="color: var(--accent-green); font-size: 0.9rem;">Earns <strong>5 MST</strong> per cycle</p>
        
        <div class="progress-bar-bg">
          <div id="mine-progress" class="progress-bar-fill"></div>
        </div>

        <button id="mine-btn" class="spin-btn" style="background: linear-gradient(45deg, #00ff88, #00b4d8); color: #000;" onclick="toggleMining()">START MINING</button>
      </div>
    </div>

    <!-- WITHDRAWAL TAB -->
    <div id="withdraw-tab" class="tab-content">
      <h2>Withdraw MST</h2>
      <p style="color: var(--text-dim); margin-bottom: 20px;">Minimum Withdrawal: <strong>50 MST</strong></p>
      
      <form class="withdraw-form" onsubmit="handleWithdraw(event)">
        <div class="form-group">
          <label>MST Wallet Address</label>
          <input type="text" id="wallet-addr" placeholder="0x..." required>
        </div>
        <div class="form-group">
          <label>Amount to Withdraw</label>
          <input type="number" id="withdraw-amount" placeholder="50" min="50" step="any" required>
        </div>
        <button type="submit" class="withdraw-btn">SUBMIT REQUEST</button>
      </form>

      <h3 style="margin-top: 30px; font-size: 1rem;">Transaction History</h3>
      <ul id="history-list" class="history-list">
        <!-- Dynamically Populated -->
      </ul>
    </div>
  </div>

  <!-- COLORFUL POPUP MODAL -->
  <div id="custom-modal" class="modal-overlay">
    <div class="modal-card">
      <div id="modal-icon" class="modal-icon"><i class="fa-solid fa-trophy"></i></div>
      <h3 id="modal-title" class="modal-title">CONGRATULATIONS!</h3>
      <div id="modal-body" class="modal-body">You earned 100 MST!</div>
      <div class="modal-buttons" id="modal-buttons">
        <button class="modal-btn" onclick="closeModal()">CLAIM NOW</button>
      </div>
    </div>
  </div>

  <script>
    // --- APP STATE & LOCAL STORAGE PERSISTENCE ---
    const VALUES = [100, 13, 0, 5, 50, 2, 0];
    const COLORS = ['#ff0055', '#7209b7', '#3f37c9', '#4cc9f0', '#ffb703', '#f72585', '#4895ef'];
    const MAX_DAILY_SPINS = 10;
    const MONETAG_AD_LINK = "https://omg10.com/4/11268369";

    // Helper to check if today is a new calendar day
    function getTodayDateString() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }

    // Check saved date for daily spin reset
    const savedDate = localStorage.getItem('mst_last_spin_date');
    const todayStr = getTodayDateString();
    let initialSpins = MAX_DAILY_SPINS;

    if (savedDate === todayStr) {
      const storedSpins = localStorage.getItem('mst_spins');
      initialSpins = storedSpins !== null ? parseInt(storedSpins) : MAX_DAILY_SPINS;
    } else {
      localStorage.setItem('mst_last_spin_date', todayStr);
      localStorage.setItem('mst_spins', MAX_DAILY_SPINS);
    }

    let state = {
      balance: parseFloat(localStorage.getItem('mst_balance')) || 0,
      spinsLeft: initialSpins,
      withdrawals: JSON.parse(localStorage.getItem('mst_txs')) || []
    };

    function saveState() {
      localStorage.setItem('mst_balance', state.balance);
      localStorage.setItem('mst_spins', state.spinsLeft);
      localStorage.setItem('mst_last_spin_date', getTodayDateString());
      localStorage.setItem('mst_txs', JSON.stringify(state.withdrawals));
      updateUI();
    }

    function updateUI() {
      document.getElementById('balance').innerText = state.balance.toFixed(2);
      document.getElementById('spins-left').innerText = state.spinsLeft;
      
      // Render History
      const historyList = document.getElementById('history-list');
      historyList.innerHTML = '';
      if(state.withdrawals.length === 0) {
        historyList.innerHTML = '<li style="color: var(--text-dim); text-align:center;">No withdrawals yet</li>';
      } else {
        state.withdrawals.forEach(tx => {
          const li = document.createElement('li');
          li.className = 'history-item';
          li.innerHTML = `<span>${tx.amount} MST to ${tx.addr.substring(0,6)}...</span> <strong style="color:var(--accent-gold);">${tx.status}</strong>`;
          historyList.appendChild(li);
        });
      }
    }

    // --- TAB SWITCHING LOGIC ---
    function switchTab(tabId, event) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      if (event && event.currentTarget) {
        event.currentTarget.classList.add('active');
      }
    }

    // --- CANVAS WHEEL DRAWING ---
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const numSegments = VALUES.length;
    const arcSize = (2 * Math.PI) / numSegments;
    let currentAngle = 0;
    let isSpinning = false;

    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSegments; i++) {
        const angle = currentAngle + i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arcSize);
        ctx.lineTo(radius, radius);
        ctx.fill();

        // Draw Text
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px Poppins";
        ctx.translate(radius, radius);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillText(VALUES[i] + " MST", radius - 20, 5);
        ctx.restore();
      }
    }

    // --- SPIN LOGIC ---
    function spinWheel() {
      if (isSpinning) return;
      
      if (state.spinsLeft <= 0) {
        showModal("NO SPINS LEFT TODAY", "You have used all 10 of your daily spins! Mine or check back tomorrow for 10 fresh spins.", "fa-circle-exclamation");
        return;
      }

      isSpinning = true;
      document.getElementById('spin-btn').disabled = true;
      state.spinsLeft--;

      const selectedIndex = Math.floor(Math.random() * numSegments);
      const targetValue = VALUES[selectedIndex];
      
      const degreesToStop = (numSegments - selectedIndex) * arcSize - (arcSize / 2) - (Math.PI / 2);
      const totalRotation = (Math.PI * 2 * 5) + degreesToStop;

      let start = null;
      const duration = 4000;

      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = (timestamp - start) / duration;
        
        if (progress < 1) {
          const easeOut = 1 - Math.pow(1 - progress, 3);
          currentAngle = easeOut * totalRotation;
          drawWheel();
          requestAnimationFrame(animate);
        } else {
          currentAngle = totalRotation % (Math.PI * 2);
          drawWheel();
          isSpinning = false;
          document.getElementById('spin-btn').disabled = false;

          // Award Coins
          state.balance += targetValue;
          saveState();

          // Show Popup with Double Coins Option
          if (targetValue > 0) {
            showSpinModal("CONGRATULATIONS!", `You won ${targetValue} MST Coins!`, "fa-gift", targetValue);
          } else {
            showModal("BAD LUCK!", "You hit 0 MST. Try spinning again!", "fa-face-frown");
          }
        }
      }

      requestAnimationFrame(animate);
    }

    // Function to handle Claiming Double Coins via Monetag Link
    function claimDoubleCoins(amount) {
      window.open(MONETAG_AD_LINK, '_blank');
      state.balance += amount; // Award second half (doubling the reward)
      saveState();
      closeModal();
      showModal("DOUBLE COINS CLAIMED!", `Bonus added! You earned a total of ${amount * 2} MST Coins!`, "fa-coins");
    }

    // --- MINING SIMULATION LOGIC ---
    let miningInterval = null;
    let miningProgress = 0;

    function toggleMining() {
      const btn = document.getElementById('mine-btn');
      const bar = document.getElementById('mine-progress');

      if (miningInterval) {
        // Stop Mining
        clearInterval(miningInterval);
        miningInterval = null;
        btn.innerText = "START MINING";
        btn.style.background = "linear-gradient(45deg, #00ff88, #00b4d8)";
      } else {
        // Start Mining
        btn.innerText = "STOP MINING";
        btn.style.background = "linear-gradient(45deg, #f72585, #7209b7)";
        
        miningInterval = setInterval(() => {
          miningProgress += 5;
          bar.style.width = miningProgress + "%";

          if (miningProgress >= 100) {
            miningProgress = 0;
            bar.style.width = "0%";
            
            // EARN 5 MST COINS PER CYCLE
            state.balance += 5;
            saveState();

            // Show colorful notification modal for mined coins
            showModal("MINING SUCCESS!", "Your cloud rig successfully mined 5 MST Coins!", "fa-hammer");
          }
        }, 500);
      }
    }

    // --- WITHDRAW LOGIC ---
    function handleWithdraw(e) {
      e.preventDefault();
      const addr = document.getElementById('wallet-addr').value;
      const amount = parseFloat(document.getElementById('withdraw-amount').value);

      if (amount > state.balance) {
        showModal("INSUFFICIENT FUNDS", "You do not have enough MST balance.", "fa-triangle-exclamation");
        return;
      }

      // Trigger Monetag Ad Link on Withdrawal Submit
      window.open(MONETAG_AD_LINK, '_blank');

      // Deduct balance and record transaction
      state.balance -= amount;
      state.withdrawals.unshift({
        addr: addr,
        amount: amount,
        status: 'Pending'
      });

      saveState();
      document.getElementById('wallet-addr').value = '';
      document.getElementById('withdraw-amount').value = '';

      showModal("SUCCESSFUL!", `Withdrawal request of ${amount} MST placed successfully!`, "fa-circle-check");
    }

    // --- COLORFUL MODAL LOGICS ---
    function showModal(title, message, iconClass = "fa-trophy") {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerText = message;
      document.getElementById('modal-icon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
      document.getElementById('modal-buttons').innerHTML = `<button class="modal-btn" onclick="closeModal()">CLAIM NOW</button>`;
      document.getElementById('custom-modal').classList.add('show');
    }

    function showSpinModal(title, message, iconClass, wonAmount) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerText = message;
      document.getElementById('modal-icon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
      document.getElementById('modal-buttons').innerHTML = `
        <button class="modal-btn double-btn" onclick="claimDoubleCoins(${wonAmount})"><i class="fa-solid fa-play"></i> CLAIM 2X COINS (${wonAmount * 2} MST)</button>
        <button class="modal-btn" onclick="closeModal()">CLAIM ${wonAmount} MST</button>
      `;
      document.getElementById('custom-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('custom-modal').classList.remove('show');
    }

    // Initialize Wheel and State on Page Load
    drawWheel();
    updateUI();
  </script>
</body>
</html>
